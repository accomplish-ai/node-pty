name: Windows cleanup candidate

on:
  push:
    branches: [codex/windows-conpty-cleanup]
  pull_request:
    branches: [accomplish-1.1]

permissions:
  contents: read

jobs:
  diagnostic-existing-binary:
    name: Attribute handles using the previous diagnostic binary
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35878431109
          name: node-pty-windows-node22-0ccaf30700fc1548d9ec9d57e728ab10f07efcb3-1
          path: previous-diagnostic
      - name: Verify and inspect the previous diagnostic build
        shell: pwsh
        env:
          NODE_PTY_TRACE_CLEANUP: '1'
        run: |
          $receipt = Get-Content previous-diagnostic/build-provenance.json -Raw | ConvertFrom-Json
          if ($receipt.sourceCommit -ne '0ccaf30700fc1548d9ec9d57e728ab10f07efcb3') { throw 'Unexpected diagnostic source' }
          if ((Get-FileHash previous-diagnostic/node-pty-1.1.0.tgz -Algorithm SHA256).Hash.ToLower() -ne $receipt.archiveSha256) { throw 'Diagnostic archive mismatch' }
          tar -xf previous-diagnostic/node-pty-1.1.0.tgz -C previous-diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic extraction failed' }
          New-Item -ItemType Directory previous-diagnostic/package/build | Out-Null
          Copy-Item previous-diagnostic/package/prebuilds/win32-x64 previous-diagnostic/package/build/Release -Recurse
          node --expose-gc scripts/windows-cleanup-regression.mjs child "$PWD/previous-diagnostic/package/lib/index.js" natural
  native-candidate:
    name: Windows native cleanup (Node ${{ matrix.node }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build TypeScript and native code
        id: build
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript build failed' }
          npx --no-install node-gyp rebuild
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          node scripts/post-install.js
          if ($LASTEXITCODE -ne 0) { throw 'Native staging failed' }
      - name: Pack the exact candidate for Windows 11 proof
        shell: pwsh
        run: |
          $candidateDirectory = Join-Path $env:RUNNER_TEMP 'node-pty-candidate'
          New-Item -ItemType Directory -Force $candidateDirectory | Out-Null
          $prebuildDirectory = Join-Path $PWD 'prebuilds/win32-x64'
          New-Item -ItemType Directory -Force $prebuildDirectory | Out-Null
          Get-ChildItem build/Release -File | Where-Object { $_.Extension -in @('.node', '.dll', '.exe') } | Copy-Item -Destination $prebuildDirectory
          Copy-Item build/Release/conpty -Destination $prebuildDirectory -Recurse
          npm pack --ignore-scripts --pack-destination $candidateDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Candidate pack failed' }
          $archive = Get-ChildItem $candidateDirectory -Filter '*.tgz'
          if (@($archive).Count -ne 1) { throw 'Expected exactly one candidate archive' }
          @{
            sourceCommit = (git rev-parse HEAD).Trim()
            upstreamCommit = '1def5774632305246fe21f0f69e23a664d6c5910'
            nodeVersion = (node --version)
            platform = 'win32'
            architecture = 'x64'
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            archiveSha256 = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLower()
            qualification = 'Build artifact; inspect subsequent regression result separately'
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $candidateDirectory 'build-provenance.json')
      - name: Verify cleanup without forced process exit
        run: node scripts/windows-cleanup-regression.mjs .
      - name: Diagnose native handle ownership
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NODE_PTY_TRACE_CLEANUP: '1'
        run: node --expose-gc scripts/windows-cleanup-regression.mjs child "$PWD/lib/index.js" natural
      - name: Diagnose shutdown crash when SDK debugger is available
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $debugger = "${env:ProgramFiles(x86)}/Windows Kits/10/Debuggers/x64/cdb.exe"
          if (!(Test-Path -LiteralPath $debugger)) {
            Write-Output 'SDK debugger is not installed; no crash-stack evidence collected'
            exit 0
          }
          & $debugger -c 'g; .exr -1; .ecxr; kb; q' (Get-Command node).Source --expose-gc scripts/windows-cleanup-regression.mjs child "$PWD/lib/index.js" shutdown
      - name: Preserve build artifact and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-pty-windows-node${{ matrix.node }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-pty-candidate
          if-no-files-found: warn
          retention-days: 30
